version: '3.9'

services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ../Backend/.env
    networks:
      - trackbus

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - trackbus

networks:
  trackbus:
    driver: bridge